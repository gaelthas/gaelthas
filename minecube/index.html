    <style rel="stylesheet" crossorigin>:root{--paper: #fcfdff;--ink: #252d3a;--ink-soft: #5c6676;--line: #cad1dd;--accent: #21427f;--accent-soft: #d9e4fa;--danger: #c42d32;--sky: #c8cfdd}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 26px;pointer-events:none}#hud .left,#hud .right{display:flex;align-items:center;gap:10px}#stats{font-size:17px;font-weight:500}#fps{font-size:12px;color:var(--ink-soft);min-width:54px}#time{font-size:22px;font-variant-numeric:tabular-nums;min-width:78px;text-align:right}#hud button{pointer-events:auto}button{font:inherit;font-size:14px;padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;transition:background .14s,border-color .14s,color .14s}button:hover{background:#f2f5fb;border-color:#b6c1d4}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.primary:hover{background:#1a3568}button.toggle[aria-pressed=true]{background:var(--accent-soft);border-color:#7f9ed6;color:var(--accent)}#foot{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:0 26px 16px;pointer-events:none}#status{position:fixed;left:0;right:0;bottom:48px;margin:0;text-align:center;font-size:13px;color:var(--ink-soft);pointer-events:none}#hint{margin:0;font-size:13px;color:var(--ink-soft);flex:1;text-align:center}.spacing{display:flex;align-items:center;gap:8px;pointer-events:auto;font-size:13px;color:var(--ink-soft)}.spacing input{width:150px}.spacing span{min-width:42px;text-a   <body>
    <canvas id="view"></canvas>

<header id="hud">
  <div class="left">
    <span id="stats"></span>
    <span id="fps"></span>
  </div>
  <div class="right">
    <span id="time">00:00</span>
    <button id="btn-restart" type="button" data-text="restart"></button>
    <button id="btn-board" type="button" data-text="board"></button>
    <button id="btn-options" type="button" data-text="options"></button>
  </div>
</header>

<p id="status"></p>

<footer id="foot">
  <p id="hint"></p>
  <div class="spacing">
    <label for="spacing" data-text="spacing"></label>
    <input id="spacing" type="range" min="100" max="200" step="1" value="100" aria-label="spacing" />
    <span id="spacing-value">100%</span>
  </div>
</footer>

<div id="board-panel" class="overlay" hidden>
  <div class="panel">
    <h2 data-text="boardTitle"></h2>
    <p class="sub" data-text="boardSub"></p>

    <div class="row">
      <label for="side" data-text="side"></label>
      <input id="side" type="range" min="3" max="11" step="1" value="5" />
      <output id="side-value">5</output>
    </div>
    <div class="row">
      <label for="mines" data-text="mines"></label>
      <input id="mines" type="range" min="1" max="100" step="1" value="38" />
      <output id="mines-value">38</output>
    </div>
    <p class="hint-line" id="board-hint"></p>

    <div class="actions">
      <button id="board-cancel" type="button" data-text="cancel"></button>
      <button id="board-start" type="button" class="primary" data-text="start"></button>
    </div>
  </div>
</div>

<div id="options-panel" class="overlay" hidden>
  <div class="panel">
    <h2 data-text="optionsTitle"></h2>
    <p class="sub" data-text="optionsSub"></p>

    <div class="row">
      <label for="volume" data-text="volume"></label>
      <input id="volume" type="range" min="0" max="100" step="1" value="70" />
      <output id="volume-value">70</output>
    </div>
    <div class="row">
      <label data-text="mute"></label>
      <button id="mute" type="button" class="toggle" data-text="mute"></button>
    </div>
    <div class="row">
      <label data-text="fpsLabel"></label>
      <button id="show-fps" type="button" class="toggle" data-text="fpsButton"></button>
    </div>

    <div class="row">
      <label for="map-left" data-text="mouseLeft"></label>
      <select id="map-left"></select>
    </div>
    <div class="row">
      <label for="map-middle" data-text="mouseMiddle"></label>
      <select id="map-middle"></select>
    </div>
    <div class="row">
      <label for="map-right" data-text="mouseRight"></label>
      <select id="map-right"></select>
    </div>

    <div class="actions">
      <span class="version" id="version"></span>
      <button id="options-close" type="button" class="primary" data-text="close"></button>
    </div>
  </div>
</div>

<div id="result" class="overlay" hidden>
  <div class="panel narrow">
    <h2 id="result-title"></h2>
    <p class="big" id="result-time">00:00</p>
    <p class="sub" id="result-detail"></p>
    <div class="actions">
      <button id="result-close" type="button" data-text="close"></button>
      <button id="result-again" type="button" class="primary" data-text="again"></button>
    </div>
  </div>
</div>

  </body>
</html>
